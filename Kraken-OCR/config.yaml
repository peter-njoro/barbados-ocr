general:
  repo_root: "/content"

training:
  train_csv: "/content/data/barbados-ocr-data/Train.csv"
  base_image_dir: "/content/data/barbados-ocr-data/images"
  output: "/content/code/scripts/Kraken-OCR/kraken_model"
  load_model: null
  load_hyper_parameters: false
  append: null
  resize: null
  train_data_dir: "/content/code/scripts/Kraken-OCR/kraken_train_data"
  log_dir: "/content/code/scripts/Kraken-OCR/training_logs"
  batch_size: 16
  epochs: 1
  partition: 0.9
  format_type: "path"
  force_binarization: false

inference:
  model_path: "/content/code/scripts/Kraken-OCR/kraken_model_catmus_continued_2.mlmodel"
  test_csv: "/content/data/barbados-ocr-data/Test.csv"
  base_image_dir: "/content/data/barbados-ocr-data/images"
  output_csv: "/content/submission.csv"
  device: "auto"
  use_gpu: true
  pad: 16
  threshold: null
  text_direction: "horizontal-lr"
  bidi_reordering: true

evaluation:
  pred_csv: "submission.csv"
  pub_gt: "pub_ref.csv"
  priv_gt: "priv_ref.csv"
  weight_factor: 0.5
